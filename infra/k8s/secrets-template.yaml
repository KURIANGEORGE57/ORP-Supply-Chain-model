# Kubernetes Secrets Template
# DO NOT commit actual secrets to version control!
# Use this as a template and create secrets using kubectl or external secret management

# Example creation command:
# kubectl create secret generic veritas-secrets \
#   --from-literal=database-url='postgresql://user:pass@host:5432/db' \
#   --from-literal=redis-url='redis://host:6379/0' \
#   --from-literal=secret-key='your-secret-key-here' \
#   --from-literal=service-token='your-service-token-here'

apiVersion: v1
kind: Secret
metadata:
  name: veritas-secrets
type: Opaque
stringData:
  database-url: "postgresql://veritas:CHANGE_ME@postgres-service:5432/veritas"
  redis-url: "redis://redis-service:6379/0"
  secret-key: "CHANGE_ME_use_openssl_rand_hex_32"
  service-token: "CHANGE_ME_worker_service_token"
