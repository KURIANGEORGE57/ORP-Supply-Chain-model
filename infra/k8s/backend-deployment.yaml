apiVersion: apps/v1
kind: Deployment
metadata:
  name: veritas-backend
  labels:
    app: veritas-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: veritas-backend
  template:
    metadata:
      labels:
        app: veritas-backend
    spec:
      containers:
      - name: backend
        image: veritas-orp/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: secret-key
        - name: SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: service-token
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: veritas-backend
spec:
  type: LoadBalancer
  selector:
    app: veritas-backend
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
