apiVersion: apps/v1
kind: Deployment
metadata:
  name: veritas-ui
  labels:
    app: veritas-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: veritas-ui
  template:
    metadata:
      labels:
        app: veritas-ui
    spec:
      containers:
      - name: ui
        image: veritas-orp/ui:latest
        ports:
        - containerPort: 3000
        env:
        - name: VITE_API_URL
          value: "http://veritas-backend/api/v1"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: veritas-ui
spec:
  type: LoadBalancer
  selector:
    app: veritas-ui
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
