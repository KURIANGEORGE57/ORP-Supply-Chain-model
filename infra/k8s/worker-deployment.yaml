apiVersion: apps/v1
kind: Deployment
metadata:
  name: veritas-worker
  labels:
    app: veritas-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: veritas-worker
  template:
    metadata:
      labels:
        app: veritas-worker
    spec:
      containers:
      - name: worker
        image: veritas-orp/backend:latest
        command: ["python", "-m", "rq", "worker", "default"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: redis-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: veritas-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: veritas-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
