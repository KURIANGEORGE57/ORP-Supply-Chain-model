version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: veritas_pass
      POSTGRES_DB: veritas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    build: ../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://veritas:veritas_pass@postgres:5432/veritas
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  worker:
    build: ../backend
    command: python -m rq worker default
    volumes:
      - ../backend:/app
    environment:
      DATABASE_URL: postgresql://veritas:veritas_pass@postgres:5432/veritas
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  ui:
    build: ../ui
    volumes:
      - ../ui:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1

volumes:
  pgdata:
